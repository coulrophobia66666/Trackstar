name = "trackstar-songtext-worker"
main = "songtext-worker.js"
compatibility_date = "2025-01-01"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

# D1-Datenbank fuer Konten/Credits/Abo.
[[d1_databases]]
binding = "DB"
database_name = "overhertz-db"
database_id = "9b018ec9-57cc-4410-a69d-492bfd160611"

# Nachts um 3 Uhr UTC: Genre-Kennzahlen aus check_results neu berechnen (siehe scheduled-Handler
# in songtext-worker.js). Manuell zusaetzlich ueber POST /admin/aggregate-genres anstossbar
# (braucht den Secret ADMIN_SECRET, einmalig im Cloudflare-Dashboard unter Settings setzen).
[triggers]
crons = ["0 3 * * *"]
