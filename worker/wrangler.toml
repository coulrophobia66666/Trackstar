name = "trackstar-songtext-worker"
main = "songtext-worker.js"
compatibility_date = "2025-01-01"

# Ohne das hier im Repo zurueckgesetzt der naechste Git-Deploy die im Dashboard manuell
# aktivierten Protokolle wieder auf "Deaktiviert" (Diagnose des Resend-E-Mail-Problems, siehe
# OFFENE-PUNKTE.md).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# Nicht geheime Klartext-Variablen (Stripe Price-/Coupon-IDs, Absenderadresse). Im Repo statt nur
# im Dashboard, weil ein im Dashboard gesetzter Wert sonst beim naechsten Git-Deploy zurueckgesetzt
# wird - gleiches Problem wie bei [observability] oben (siehe OFFENE-PUNKTE.md, 12./13.08.). Vermutlich
# auch die Ursache dafuer, dass RESEND_FROM_EMAIL bei der E-Mail-Verifizierungs-Diagnose immer wieder
# als fehlend auffiel, obwohl es schon mal gesetzt wurde. Bei Aenderungen hier UND im jeweiligen
# Dienst (Stripe-Dashboard bzw. Resend) synchron halten.
# STRIPE_PRICE_* wurden am 14.08. neu angelegt (tax_behavior "inclusive" statt "exclusive") - die
# alten IDs haben bei Stripes automatischer Steuerberechnung zusaetzlich ~19% MwSt. ON TOP des auf
# der Seite angezeigten Preises berechnet, ohne dass das im Frontend sichtbar war. tax_behavior
# laesst sich bei Stripe nachtraeglich nicht mehr aendern, deshalb neue Price-Objekte statt Update.
[vars]
STRIPE_PRICE_CREDITS = "price_1U4IvHGeogeSlSp3kKbjnKlg"
STRIPE_PRICE_PRO_MONTHLY = "price_1U4IvMGeogeSlSp3WZZvDzXF"
STRIPE_PRICE_PRO_ANNUAL = "price_1U4IvQGeogeSlSp3WW45ZWa8"
STRIPE_COUPON_FLASH_SALE_CREDITS = "FLASH50CREDITS"
RESEND_FROM_EMAIL = "Overhertz <noreply@overhertz.app>"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60

# D1-Datenbank fuer Konten/Credits/Abo.
[[d1_databases]]
binding = "DB"
database_name = "overhertz-db"
database_id = "9b018ec9-57cc-4410-a69d-492bfd160611"

# Objektspeicher fuer Battle-Rap-Contest-Einreichungen (Track + Bild je Teilnehmer/Runde) - der
# Bucket muss einmalig manuell angelegt werden (Cloudflare-Dashboard -> R2, oder per
# Cloudflare-Konnektor), bevor der Worker damit deployt wird, siehe OFFENE-PUNKTE.md.
[[r2_buckets]]
binding = "BATTLE_MEDIA"
bucket_name = "overhertz-battle-media"

# Nachts um 3 Uhr UTC: Genre-Kennzahlen aus check_results neu berechnen (siehe scheduled-Handler
# in songtext-worker.js). Manuell zusaetzlich ueber POST /admin/aggregate-genres anstossbar
# (braucht den Secret ADMIN_SECRET, einmalig im Cloudflare-Dashboard unter Settings setzen).
[triggers]
crons = ["0 3 * * *"]
